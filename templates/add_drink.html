<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Drink - Caffeine Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>☕ Add a Drink</h1>
        <!-- Adds the drinks the user has had to the database -->
        <form action="{{ url_for('add_drink') }}" method="POST" class="drink-form">
            <div class="form-group">
                <label for="coffee_type">Coffee Type:</label>
                <select name="coffee_type" id="coffee_type" required>
                    <option value="">-- Select Type --</option>
                    {% for type in types %}
                    <option value="{{ type }}">{{ type }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="size">Size:</label>
                <select name="size" id="size" required>
                    <option value="">-- Select Size --</option>
                    {% for size in sizes %}
                    <option value="{{ size }}">{{ size }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn">Log Drink</button>
        </form>

        <a href="{{ url_for('home') }}" class="btn btn-secondary">← Back to Home</a>
    </div>
</body>
</html>
